<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo List</title>
    <script src="../script/tareas.js"></script>
    <link rel="stylesheet" href="../style/tareas.css">
</head>
<body>

    <div class="container">
        <div class="navbar">
            <a href="contactos.html" class="nav-btn">Mis Contactos</a>
            <a href="favoritos.html" class="nav-btn">Favoritos</a>
            <a href="nuevo_contacto.html" class="nav-btn">Nuevo Contacto</a>
            <a href="tareas.html" class="nav-btn">Tareas</a>
            <a href="perfil.html" class="nav-btn">Mi Perfil</a>
        </div>
        <h1>Mis Tareas</h1>
        <div class="todo-list-container">
            <div class="filter-container">
                <label for="task-filter">Filtrar tareas:</label>
                <select id="task-filter">
                    <option value="all">Todas</option>
                    <option value="pending">Pendientes</option>
                    <option value="completed">Completadas</option>
                </select>
            </div>
            <div class="todo-header">
                <button class="btn" id="add-task-btn">Agregar Tarea</button>
            </div>
            <div class="todo-items" id="todo-items">
            </div>
        </div>
        <div class="todo-form-modal" id="todo-form-modal">
            <div class="todo-form-container">
                <h2>Detalles de la Tarea</h2>
                <form id="todo-form">
                    <label for="task-name">Nombre de la Tarea:</label>
                    <input type="text" id="task-name" required>

                    <label for="task-description">Descripción:</label>
                    <textarea id="task-description" required></textarea>

                    <label for="task-duration">Duración (en horas):</label>
                    <input type="number" id="task-duration" required>

                    <label for="task-priority">Prioridad:</label>
                    <select id="task-priority" required>
                        <option value="baja">Baja</option>
                        <option value="media">Media</option>
                        <option value="alta">Alta</option>
                    </select>

                    <button type="submit" class="btn" id="submit-task-btn">Guardar Tarea</button>
                    <button type="button" class="btn" id="cancel-task-btn">Cancelar</button>
                </form>
            </div>
        </div>
        <div id="confirm-modal" class="modal">
            <div class="modal-content">
                <h3>¿Estás seguro de marcar esta tarea como completada?</h3>
                <button id="confirm-complete-btn" class="btn">Sí, completar</button>
                <button id="cancel-complete-btn" class="btn">Cancelar</button>
            </div>
        </div>
        <div id="delete-confirm-modal" class="modal">
            <div class="modal-content">
                <h3>¿Estás seguro de que deseas eliminar esta tarea?</h3>
                <div class="modal-actions">
                    <button id="confirm-delete-btn" class="btn">Eliminar</button>
                    <button id="cancel-delete-btn" class="btn">Cancelar</button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
