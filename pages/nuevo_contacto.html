<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Contacto</title>
</head>
<body>
    <div class="form-container">
        <h1>Nuevo Contacto</h1>
        
        <form class="contact-form" action="#">
            <div class="form-note">
            <p><strong>Nota:</strong> Los campos marcados con * son obligatorios.</p>
        </div>
            <div class="form-group">
                <label>Nombres *</label>
                <input type="text" required placeholder="Ej: Juan">
            </div>
            
            <div class="form-group">
                <label>Apellidos *</label>
                <input type="text" required placeholder="Ej: Pérez">
            </div>
            
            <div class="form-group">
                <label>Correo Electrónico *</label>
                <input type="email" required placeholder="ejemplo@email.com">
            </div>
            
            <div class="form-group">
                <label>Número de Teléfono *</label>
                <input type="tel" required placeholder="123456789">
            </div>
            
            <div class="form-group">
                <label>Dirección</label>
                <input type="text" placeholder="Calle, número, ciudad">
            </div>
            
            <div class="form-group">
                <label>Fecha de Nacimiento</label>
                <input type="date">
            </div>
            
            <div class="form-group">
                <label>Oficio</label>
                <input type="text" placeholder="Ej: Ingeniero">
            </div>
            
            <div class="form-actions">
                <a href="contactos.html" class="btn btn-cancel">Cancelar</a>
                <button type="submit" class="btn btn-submit">Guardar</button>
            </div>
        </form>
    </div>
</body>
</html>
