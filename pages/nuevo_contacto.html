<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Contacto</title>
    <link rel="stylesheet" href="../style/nuevo_contacto.css">
</head>
<body>
    <div class="form-container">
        <header class="form-header">
            <h1>Nuevo Contacto</h1>
            <p class="form-subtitle">Agrega un nuevo contacto a tu agenda</p>
        </header>
        
        <form class="contact-form" action="#">
            <div class="form-note">
                <p><strong>Nota:</strong> Los campos marcados con <span class="required-mark">*</span> son obligatorios.</p>
            </div>
            
            <div class="form-fields">
                <div class="form-row">
                    <div class="form-group">
                        <label>Nombres <span class="required-mark">*</span></label>
                        <input type="text" required placeholder="Ej: Juan">
                    </div>
                    
                    <div class="form-group">
                        <label>Apellidos <span class="required-mark">*</span></label>
                        <input type="text" required placeholder="Ej: Pérez">
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Correo Electrónico <span class="required-mark">*</span></label>
                        <input type="email" required placeholder="ejemplo@email.com">
                    </div>
                    
                    <div class="form-group">
                        <label>Número de Teléfono <span class="required-mark">*</span></label>
                        <input type="tel" required placeholder="123456789">
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Dirección</label>
                        <input type="text" placeholder="Calle, número, ciudad">
                    </div>
                    
                    <div class="form-group">
                        <label>Fecha de Nacimiento</label>
                        <input type="date">
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group full-width">
                        <label>Oficio</label>
                        <input type="text" placeholder="Ej: Ingeniero, Doctor, Profesor">
                    </div>
                </div>
            </div>
            
            <div class="form-actions">
                <a href="contactos.html" class="btn btn-cancel">Cancelar</a>
                <button type="submit" class="btn btn-submit">Guardar Contacto</button>
            </div>
        </form>
    </div>
    
    <script src="../script/nuevo_contacto.js"></script>
</body>
</html>
