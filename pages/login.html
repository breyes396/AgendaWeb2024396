<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../style/login.css">
</head>
<body>

    <div class="login-container">
        <h1>Login</h1>
        <form id="loginForm" action="#" method="get">
            <div class="logo">
                <img src="../images/logo.png" alt="Logo de la Agenda Web" class="logo-img">
            </div>
            <div class="welcome-message">
                <h3>Bienvenido a tu agenda web personal</h3>
                <p>Por favor, inicia sesión para continuar.</p> 
            </div>           
            <div class="input-group">
                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" name="email" required placeholder="Introduce tu correo">
            </div>
            <div class="input-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required placeholder="Introduce tu contraseña">
            </div>
            <button type="submit" class="btn">Iniciar sesión</button>
        </form>
    </div>

    <script src="../script/login.js"></script>
</body>
</html>
