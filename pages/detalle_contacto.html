<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles del Contacto</title>
    <link rel="stylesheet" href="../style/detalle_contacto.css">
</head>
<body>

    <div class="container">
        <div class="contact-details">
            <h1>Detalles del Contacto</h1>
            <form>
                <div class="form-row">
                    <div class="form-column">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="contactNombre" disabled>

                        <label for="apellidos">Apellidos</label>
                        <input type="text" id="contactApellidos" disabled>

                        <label for="correo">Correo electrónico</label>
                        <input type="email" id="contactCorreo" disabled>

                        <label for="telefono">Número de Teléfono</label>
                        <input type="tel" id="contactTelefono" disabled>
                    </div>

                    <div class="form-column">
                        <label for="direccion">Dirección</label>
                        <input type="text" id="contactDireccion" disabled>

                        <label for="fecha">Fecha de Nacimiento</label>
                        <input type="date" id="contactFecha" disabled>

                        <label for="oficio">Oficio</label>
                        <input type="text" id="contactOficio" disabled>
                    </div>
                </div>
            </form>
        </div>

        <div class="contact-btns">
            <button type="button" class="regresar" onclick="regresar()">Regresar</button>
        </div>
    </div>
    <script src="../script/detalle_contacto.js"></script>

</body>
</html>
